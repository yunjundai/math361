<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>除法小測站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a single centered exercise-book column on graph paper; one question per screen for tablets; teacher view widens to a report. */
:root{
  --bg:#EEF3F0; --grid:rgba(47,125,91,.07); --card:#FFFFFF; --ink:#1E2B28; --muted:#5A6B65; --line:#D5E0DA;
  --accent:#D25F27; --accent-soft:#FBE7DB; --on-accent:#FFFFFF;
  --good:#2F7D5B; --good-soft:#DDF0E6; --bad:#BF3B34; --bad-soft:#F8E0DE; --warn:#A86A12; --warn-soft:#F7EBD3;
  --focus:#2A6FDB;
  --f-q:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121916; --grid:rgba(120,200,160,.06); --card:#1B2421; --ink:#E6EEEA; --muted:#9BAEA6; --line:#2D3A35;
  --accent:#F0874E; --accent-soft:#3A2519; --on-accent:#1A0E07;
  --good:#5CC28F; --good-soft:#173328; --bad:#F2786E; --bad-soft:#3A1D1B; --warn:#E3AE55; --warn-soft:#352A15; --focus:#7FB0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121916; --grid:rgba(120,200,160,.06); --card:#1B2421; --ink:#E6EEEA; --muted:#9BAEA6; --line:#2D3A35;
  --accent:#F0874E; --accent-soft:#3A2519; --on-accent:#1A0E07;
  --good:#5CC28F; --good-soft:#173328; --bad:#F2786E; --bad-soft:#3A1D1B; --warn:#E3AE55; --warn-soft:#352A15; --focus:#7FB0FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;min-height:100%}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#app.wide{max-width:1080px}
h1,h2,h3{font-family:var(--f-q);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:2rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 20px;cursor:pointer;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:1.15rem;padding:14px 30px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500}
.inp{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:48px;width:100%}
.inp:focus{border-color:var(--accent);outline:none}

/* brand strip */
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand .mark{font-family:var(--f-q);font-weight:700;font-size:1.05rem;color:var(--accent);letter-spacing:.08em}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* start screen */
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tcard{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tcard .tag{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.tcard .tt{font-family:var(--f-q);font-size:1.6rem;font-weight:700}
.tcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tcard .eq{font-family:var(--f-q);font-size:1.25rem;color:var(--accent);margin-top:auto;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:700;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.nm{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;min-height:52px;font-family:var(--f-q);font-size:1.2rem}
.nm b{font-family:var(--f-ui);font-size:.95rem;min-width:1.6em;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.nm[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.nm[aria-pressed="true"] b{color:var(--accent)}
.who{display:grid;grid-template-columns:1.3fr .7fr 1.3fr;gap:12px}
@media (max-width:560px){.who{grid-template-columns:1fr 1fr}.who .full{grid-column:1/-1}}

/* zhuyin */
.zy{display:inline-flex;align-items:center;vertical-align:middle}
.zy .b{display:none;writing-mode:vertical-rl;text-orientation:upright;font-size:.42em;line-height:1.05;letter-spacing:-.05em;margin-left:1px;font-family:var(--f-ui);font-weight:400;color:var(--muted)}
.zhuyin .zy .b{display:inline-block}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-weight:500}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:.85rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.dot.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dot.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qcard{display:flex;flex-direction:column;gap:20px;padding:26px}
.qno{font-family:var(--f-q);font-size:1rem;color:var(--accent);font-weight:700;letter-spacing:.1em}
.stem{font-family:var(--f-q);font-size:1.6rem;line-height:1.9;font-variant-numeric:tabular-nums}
.zhuyin .stem{line-height:2.1}
.pic{display:flex;flex-wrap:wrap;gap:6px;font-size:2rem;line-height:1;padding:14px;border:2px dashed var(--line);border-radius:12px;max-width:520px}
.blanks{display:flex;flex-direction:column;gap:14px}
.bl{display:flex;align-items:center;gap:10px;font-family:var(--f-q);font-size:1.4rem;flex-wrap:wrap}
.nin{width:3.6em;text-align:center;font-family:var(--f-ui);font-weight:700;font-size:1.5rem;border:2px solid var(--line);border-radius:10px;padding:6px 4px;background:var(--card);font-variant-numeric:tabular-nums}
.nin:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.eqline{font-family:var(--f-q);font-size:1.8rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:var(--f-q);font-size:1.35rem;min-height:56px}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-ui);font-size:.95rem;font-weight:700}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.say{display:inline-flex;align-items:center;gap:6px}
.say svg{width:18px;height:18px}

/* long division */
.ld{display:grid;grid-template-columns:auto auto auto;column-gap:14px;row-gap:8px;align-items:center;font-family:var(--f-ui);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;justify-content:start}
.ld .lbl{font-size:.8rem;font-weight:500;color:var(--muted);font-family:var(--f-ui)}
.ld .dv{text-align:right}
.ld .nb{border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-top-left-radius:14px;padding:4px 14px 2px 16px;letter-spacing:.25em}
.ld .cell{padding-left:16px}
.ld .rule{grid-column:2;border-top:2px solid var(--ink);margin-left:16px}

/* results */
.score{display:flex;align-items:baseline;gap:10px;font-family:var(--f-q)}
.score b{font-size:3.6rem;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.marks{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.mk{border-radius:10px;padding:8px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.mk.ok{background:var(--good-soft);color:var(--good)} .mk.no{background:var(--bad-soft);color:var(--bad)}
.notice{border-radius:10px;padding:10px 14px;font-size:.92rem}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.good{background:var(--good-soft);color:var(--good)} .notice.bad{background:var(--bad-soft);color:var(--bad)}

/* teacher */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tile .v{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .l{font-size:.85rem;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;cursor:pointer;min-height:38px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.95rem}
th{font-size:.8rem;color:var(--muted);font-weight:500;letter-spacing:.06em;background:var(--bg)}
tr:last-child td{border-bottom:none}
tr.sel td{background:var(--accent-soft)}
td.num,th.num{text-align:right}
.linkbtn{background:none;border:none;padding:0;cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.bar{position:relative;height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden;min-width:80px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.bar i.pre{background:var(--muted)} .bar i.post{background:var(--accent)} .bar i.g{background:var(--good)} .bar i.w{background:var(--warn)} .bar i.r{background:var(--bad)}
.ansbox{background:var(--good-soft)!important;border-color:var(--good)!important;color:var(--good)!important;opacity:1}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);border-color:var(--good);color:var(--card)}
div.opt{cursor:default}
.itembtn{all:unset;cursor:pointer;display:block;border-radius:6px}
.itembtn:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.itembtn .more{font-family:var(--f-ui);font-size:.8rem;color:var(--accent);font-weight:700;margin-left:8px;white-space:nowrap}
.item.open{border-color:var(--accent)}
.qprev{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qprev .stem{font-size:1.35rem}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:52px 1fr 170px;gap:14px;align-items:start}
.item .id{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.item .txt{min-width:0;font-family:var(--f-q);font-size:1.05rem}
.item .rate{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.errs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-family:var(--f-ui)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:3px 10px;font-size:.82rem}
@media (max-width:600px){.item{grid-template-columns:44px 1fr}.item .rate{grid-column:1/-1}}
.skills{display:grid;gap:10px}
.sk{display:grid;grid-template-columns:minmax(0,190px) 1fr 52px;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
details.card summary{cursor:pointer;font-weight:700}
.detail{border-left:4px solid var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
textarea.csv{width:100%;min-height:140px;font-family:ui-monospace,monospace;font-size:.8rem;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
footer{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.qcard{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

/* ---------------- cloud ---------------- */
function newId(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,10); }

async function postRecord(rec){
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 12000);
  try {
    const res = await fetch(REST, {method:'POST', signal:ctl.signal,
      headers:{'apikey':SB_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal'},
      body: JSON.stringify(rec)});
    if (res.ok || res.status === 409) return 'ok';           // 409 = 已經存過（重送）
    if (res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429) return 'reject';
    return 'retry';
  } catch(e){ return 'retry'; } finally { clearTimeout(tm); }
}
async function saveRecord(rec){
  rec.client_id = newId();
  if (CFG_OK && navigator.onLine !== false){
    const r = await postRecord(rec);
    if (r === 'ok'){ dbState = 'on'; return 'cloud'; }
    if (r === 'reject'){ console.error('Supabase 拒絕這筆資料', rec); }
  }
  const pend = LS.get('pending', []); pend.push(rec); LS.set('pending', pend);
  return 'local';
}
let flushing = false;
async function flushPending(){
  if (!CFG_OK || flushing) return;
  const pend = LS.get('pending', []); if (!pend.length) return;
  flushing = true; const left = [];
  for (const r of pend){ const x = await postRecord(r); if (x === 'retry') left.push(r); else if (x === 'ok') dbState = 'on'; }
  // 先讀最新暫存，避免期間新增的被蓋掉
  const now = LS.get('pending', []); const sent = new Set(pend.filter(r => !left.includes(r)).map(r => r.client_id));
  LS.set('pending', now.filter(r => !sent.has(r.client_id)));
  flushing = false;
  if (S.view === 'start' || S.view === 'teacher') render();
}

/* ---------------- grading ---------------- */
function grade(test, answers){
  const items = test.items.map(q => {
    const a = answers[q.id];
    if (q.type === 'mc'){
      const ok = a === q.ans;
      const diag = (!ok && a != null && q.diag) ? (q.diag[String(a)] || '') : '';
      return {id:q.id, skill:q.skill, ok, given:[a == null ? '' : String.fromCharCode(65+a)], diag: a == null ? '未作答' : diag};
    }
    const given = q.blanks.map((b,k) => norm(a && a[k]));
    const oks = q.blanks.map((b,k) => given[k] !== '' && Number(given[k]) === b.ans);
    const ok = oks.every(Boolean);
    let diag = '';
    if (!ok){
      if (given.every(g => g === '')) diag = '未作答';
      else diag = q.blanks.map((b,k) => (!oks[k] && b.diag && b.diag[given[k]]) || '').filter(Boolean).join('；');
    }
    return {id:q.id, skill:q.skill, ok, given, diag};
  });
  const correct = items.filter(i => i.ok).length;
  return {items, correct, total: items.length, score: Math.round(correct / items.length * 100)};
}

function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW'; u.rate = .85;
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

  <h1>除法小測站</h1>
  <p class="muted" style="margin:0">先選要做的測驗，再點你的班級和名字，就可以開始。</p>
  <div class="tests">
    ${card(DATA.pre, '12 ÷ 4 = 3')}
    ${card(DATA.post, '25 ÷ 8 = 3 … 1')}
  </div>
  ${whoBlock()}
  ${cloudNote()}
  <div class="row"><button class="btn primary big" id="go" ${ready?'':'disabled'}>開始作答</button>
    <span class="muted small">${ready ? '' : '還沒選測驗或還沒選名字'}</span></div>
  <footer><button class="btn ghost" id="toTeacher">教師專區</button></footer>`;
}

function curTest(){ return DATA[S.test]; }
function isAnswered(q){
  const a = S.answers[q.id];
  if (q.type === 'mc') return a != null;
  return !!a && q.blanks.every((b,k) => norm(a[k]) !== '');
}
function nin(q, k, label){
  const a = S.answers[q.id] || [];
  return `<input class="nin" id="b-${q.id}-${k}" data-q="${q.id}" data-k="${k}" inputmode="numeric" autocomplete="off" aria-label="${esc(label||'答案')}" value="${esc(a[k]||'')}">`;
}
function qBody(q, pv){
  // pv = 教師預覽：{counts:{A:3,...}}，空格直接顯示正確答案
  const box = (k, label) => pv ? `<input class="nin ansbox" value="${q.blanks[k].ans}" disabled aria-label="${esc(label||'正確答案')}">` : nin(q, k, label);
  let body = '';
  if (q.pic) body += `<div class="pic" aria-label="${q.pic[1]} 個">${Array(q.pic[1]).fill(`<span>${q.pic[0]}</span>`).join('')}</div>`;
  if (q.type === 'num'){
    body += `<div class="blanks">${q.blanks.map((b,k)=>`<div class="bl">${b.preH} ${box(k,b.pre)} ${b.postH}</div>`).join('')}</div>`;
  } else if (q.type === 'eq'){
    body += `<div class="eqline">${q.exprH.map(x => typeof x === 'number' ? box(x) : x === '\n' ? '<span style="flex-basis:100%;height:0"></span>' : `<span>${x}</span>`).join('')}</div>`;
  } else if (q.type === 'long'){
    body += `<div class="ld" role="group" aria-label="直式">
      <span></span><div class="cell">${box(0,'商')}</div><span class="lbl">商</span>
      <span class="dv">${q.divisor}</span><div class="nb">${q.dividend}</div><span></span>
      <span></span><div class="cell">${box(1,'8 × 商')}</div><span class="lbl">${q.divisor} × 商</span>
      <span></span><div class="rule"></div><span></span>
      <span></span><div class="cell">${box(2,'餘數')}</div><span class="lbl">餘數</span>
    </div>`;
  } else if (q.type === 'mc'){
    if (pv){
      body += `<div class="opts">${q.optsH.map((o,i)=>{ const L='ABCD'[i], n=(pv.counts||{})[L]||0;
        return `<div class="opt ${i===q.ans?'right':''}"><span class="k">${L}</span><span style="flex:1">${o}</span><span class="pill ${i===q.ans?'good':(n?'bad':'plain')}">${i===q.ans?'正確・':''}${n} 人</span></div>`; }).join('')}</div>`;
    } else {
      const a = S.answers[q.id];
      body += `<div class="opts" role="radiogroup">${q.optsH.map((o,i)=>`<button class="opt" role="radio" data-opt="${i}" aria-checked="${a===i}"><span class="k">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div>`;
    }
  }
  return body;
}
function vQuiz(){
  const t = curTest(), q = t.items[S.idx], n = t.items.length;
  const body = qBody(q);
  return `
  <div class="qhead">
    <span class="pill plain">${t.name}${S.preview?'・預覽':''}</span>
    <span class="muted small">${esc(S.cls)} ${esc(S.seat)} 號 ${esc(S.name)}</span>
    <span class="spacer"></span>${zhuyinSwitch()}
  </div>
  <div class="dots" aria-label="題目進度">${t.items.map((x,i)=>`<button class="dot ${isAnswered(x)?'done':''} ${i===S.idx?'cur':''}" data-go="${i}" aria-label="第 ${i+1} 題">${i+1}</button>`).join('')}</div>
  <section class="card qcard">
    <div class="row"><span class="qno">第 ${S.idx+1} 題 / 共 ${n} 題</span><span class="spacer"></span>
      <button class="btn say" id="say">${SPK}唸題目</button></div>
    <div class="stem">${q.stemH}</div>
    ${body}
  </section>
  <div class="qnav">
    <button class="btn" id="prev" ${S.idx===0?'disabled':''}>上一題</button>
    <span class="spacer"></span>
    ${S.idx < n-1 ? `<button class="btn primary" id="next">下一題</button>` : `<button class="btn primary" id="toReview">檢查並交卷</button>`}
  </div>`;
}

function vReview(){
  const t = curTest();
  const miss = t.items.map((q,i)=>[q,i]).filter(([q])=>!isAnswered(q));
  return `
  <h2>交卷前檢查</h2>
  <div class="dots">${t.items.map((x,i)=>`<button class="dot ${isAnswered(x)?'done':''}" data-go="${i}" aria-label="回到第 ${i+1} 題">${i+1}</button>`).join('')}</div>
  <div class="card">
    ${miss.length ? `<p style="margin-top:0">還有 <b>${miss.length}</b> 題沒有寫完：第 ${miss.map(([,i])=>i+1).join('、')} 題。點上面的號碼可以回去寫。</p>`
                  : `<p style="margin-top:0">全部都寫完了！確定要交卷嗎？</p>`}
    <div class="row"><button class="btn" data-go="${t.items.length-1}">回去檢查</button>
    <button class="btn primary big" id="submit">${miss.length ? '還是要交卷' : '確定交卷'}</button></div>
  </div>`;
}

function vDone(){
  const r = S.result, t = curTest();
  const st = S.preview ? `<div class="notice warn">預覽模式：這次作答不會被記錄。</div>`
    : S.saveState === 'saving' ? `<div class="notice warn">正在送出…</div>`
    : S.saveState === 'cloud' ? `<div class="notice good">已經送給老師了。</div>`
    : `<div class="notice warn">先存在這台裝置，連上網路後會自動送給老師。</div>`;
  return `
  <h2>${esc(S.name)}，你完成${t.name}了！</h2>
  <div class="card" style="display:flex;flex-direction:column;gap:16px">
    <div class="score"><span>答對</span><b>${r.correct}</b><span>/ ${r.total} 題</span></div>
    <div class="marks">${r.items.map((it,i)=>`<div class="mk ${it.ok?'ok':'no'}">第${i+1}題<br>${it.ok?'✓':'再想想'}</div>`).join('')}</div>
    ${st}
  </div>
  <div class="row"><button class="btn primary big" id="nextKid">換下一位同學</button>${S.preview?'<button class="btn" id="backTeacher">回教師專區</button>':''}</div>`;
}

/* ---------------- teacher ---------------- */
function vPin(){
  return `
  <h2>教師專區登入</h2>
  <form class="card" id="loginForm" style="display:flex;flex-direction:column;gap:12px;max-width:420px">

    <label class="f">密碼<input class="inp" id="lPass" type="password" autocomplete="current-password"></label>
    ${S.loginErr?`<div class="notice bad">${esc(S.loginErr)}</div>`:''}
    <div class="row"><button class="btn primary" type="submit" ${S.loginBusy?'disabled':''}>${S.loginBusy?'登入中…':'登入'}</button><button class="btn ghost" type="button" id="toStart">回作答畫面</button></div>
    <p class="muted small" style="margin:0">帳號在 Supabase 後台的 Authentication 建立，並且要列在教師名單裡。</p>
  </form>`;
}
function allRecords(){
  const local = LS.get('pending', []).map(r => ({...r, id:r.client_id, _local:true}));
  return [...S.records, ...local];
}
function latestMap(recs){
  const m = new Map();
  for (const r of recs){
    if (S.tCls !== '全部' && r.cls !== S.tCls) continue;
    const key = r.test + '|' + r.cls + '|' + r.seat;
    if (!m.has(key) || m.get(key).ts < r.ts) m.set(key, r);
  }
  return m;
}
function rosterName(cls, seat){ const r = S.fullRoster.find(x => x.cls === cls && Number(x.seat) === Number(seat)); return r ? r.name : null; }
function students(m){
  const s = new Map();
  for (const r of m.values()){
    const key = r.cls + '|' + r.seat;
    if (!s.has(key)) s.set(key, {key, cls:r.cls, seat:r.seat, name:r.name, pre:null, post:null});
    const o = s.get(key); o[r.test] = r; if (r.ts >= (o._ts||0)){ o.name = r.name; o._ts = r.ts; }
  }
  // 名單上還沒作答的學生也列出來
  for (const r of S.fullRoster){
    if (S.tCls !== '全部' && r.cls !== S.tCls) continue;
    const key = r.cls + '|' + r.seat;
    if (!s.has(key)) s.set(key, {key, cls:r.cls, seat:Number(r.seat), name:r.name, pre:null, post:null});
  }
  for (const o of s.values()){ const n = rosterName(o.cls, o.seat); if (n) o.name = n; }
  return [...s.values()].sort((a,b) => a.cls.localeCompare(b.cls,'zh-Hant') || a.seat - b.seat);
}
const avg = a => a.length ? Math.round(a.reduce((x,y)=>x+y,0)/a.length) : null;
const sc = r => r ? r.score : null;
function barCls(p){ return p >= 80 ? 'g' : p >= 60 ? 'w' : 'r'; }

function vTeacher(){
  const recs = allRecords();
  const classes = ['全部', ...[...new Set([...recs.map(r=>r.cls), ...S.fullRoster.map(r=>r.cls)])].sort((a,b)=>a.localeCompare(b,'zh-Hant'))];
  const m = latestMap(recs), st = students(m);
  const pres = st.filter(s=>s.pre).map(s=>s.pre.score), posts = st.filter(s=>s.post).map(s=>s.post.score);
  const both = st.filter(s=>s.pre && s.post);
  const gain = avg(both.map(s=>s.post.score - s.pre.score));
  const loading = S.authed && !S.dbLoaded;

  const tiles = `
  <div class="tiles">
    <div class="tile"><div class="l">前測完成</div><div class="v">${pres.length}<span class="muted small"> 人</span></div><div class="muted small">平均 ${avg(pres) ?? '—'} 分</div></div>
    <div class="tile"><div class="l">後測完成</div><div class="v">${posts.length}<span class="muted small"> 人</span></div><div class="muted small">平均 ${avg(posts) ?? '—'} 分</div></div>
    <div class="tile"><div class="l">前後測都完成</div><div class="v">${both.length}<span class="muted small"> 人</span></div><div class="muted small">平均進步 ${gain==null?'—':(gain>=0?'+':'')+gain} 分</div></div>
    <div class="tile"><div class="l">後測需補救（低於 60 分）</div><div class="v" style="color:var(--bad)">${st.filter(s=>s.post && s.post.score<60).length}<span class="muted small"> 人</span></div><div class="muted small">見下方名單標示</div></div>
  </div>`;

  const status = s => {
    if (!s.post) return '<span class="pill plain">尚未後測</span>';
    if (s.post.score < 60) return '<span class="pill bad">需補救</span>';
    if (s.pre && s.post.score < s.pre.score) return '<span class="pill warn">退步</span>';
    if (s.post.score >= 80) return '<span class="pill good">精熟</span>';
    return '<span class="pill warn">待加強</span>';
  };
  const table = st.length ? `
  <div class="tablewrap"><table>
    <thead><tr><th>班級</th><th class="num">座號</th><th>姓名</th><th class="num">前測</th><th class="num">後測</th><th class="num">進步</th><th>狀態</th></tr></thead>
    <tbody>${st.map(s=>{
      const g = s.pre && s.post ? s.post.score - s.pre.score : null;
      return `<tr class="${S.selKey===s.key?'sel':''}"><td>${esc(s.cls)}</td><td class="num">${s.seat}</td>
      <td><button class="linkbtn" data-stu="${esc(s.key)}">${esc(s.name)}</button></td>
      <td class="num">${sc(s.pre) ?? '—'}</td><td class="num">${sc(s.post) ?? '—'}</td>
      <td class="num" style="color:${g==null?'var(--muted)':g>=0?'var(--good)':'var(--bad)'}">${g==null?'—':(g>=0?'+':'')+g}</td><td>${status(s)}</td></tr>`;}).join('')}
    </tbody></table></div>`
  : `<div class="card muted">${loading ? (S.dbSlow ? '雲端資料還沒回應，請稍候或確認網路。' : '正在讀取作答紀錄…') : '還沒有學生作答。學生交卷後，成績會即時出現在這裡。'}</div>`;

  // student detail
  let detail = '';
  const sel = st.find(s=>s.key===S.selKey);
  if (sel){
    const part = (tid) => {
      const r = sel[tid], t = DATA[tid];
      if (!r) return `<div><h3>${t.name}</h3><p class="muted">尚未作答</p></div>`;
      return `<div style="min-width:0"><h3>${t.name}　${r.score} 分 <span class="muted small">（${fmtTime(r.ts)}・${Math.round((r.sec||0)/60)} 分鐘）</span></h3>
        <ul style="margin:8px 0 0;padding-left:20px">${r.items.filter(i=>!i.ok).map(i=>{
          const q = t.items.find(x=>x.id===i.id);
          return `<li><b>${i.id}</b> ${esc(shortStem(q))}<br><span class="muted small">學生作答：${esc(gv(i))}　正確：${esc(rightAns(q))}${i.diag?`　→ ${esc(i.diag)}`:''}</span></li>`;
        }).join('') || '<li>全部答對</li>'}</ul></div>`;
    };
    detail = `<div class="card detail" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">
      <div style="grid-column:1/-1" class="row"><h2>${esc(sel.cls)} ${sel.seat} 號 ${esc(sel.name)}</h2><span class="spacer"></span><button class="btn" id="closeStu">關閉</button></div>
      ${part('pre')}${part('post')}</div>`;
  }

  // item analysis
  const tid = S.tTab, t = DATA[tid];
  const rs = [...m.values()].filter(r=>r.test===tid);
  const itemStats = t.items.map(q => {
    const its = rs.map(r => r.items.find(i=>i.id===q.id)).filter(Boolean);
    const ok = its.filter(i=>i.ok).length;
    const wrongs = new Map();
    its.filter(i=>!i.ok).forEach(i => { const k = gv(i); const w = wrongs.get(k) || {n:0, diag:i.diag}; w.n++; wrongs.set(k,w); });
    const counts = {}; its.forEach(i => { const g = i.given[0]; if (g) counts[g] = (counts[g]||0) + 1; });
    return {q, counts, n:its.length, rate: its.length ? Math.round(ok/its.length*100) : null, wrongs:[...wrongs.entries()].sort((a,b)=>b[1].n-a[1].n).slice(0,4)};
  });
  const skills = Object.entries(t.skills).map(([k,label]) => {
    const st2 = itemStats.filter(s=>s.q.skill===k && s.rate!=null);
    return {k, label, rate: st2.length ? Math.round(st2.reduce((a,s)=>a+s.rate,0)/st2.length) : null, ids: t.items.filter(q=>q.skill===k).map(q=>q.id).join('、')};
  });
  const analysis = `
  <div class="row"><h2>題目分析</h2><span class="spacer"></span>
    <div class="tabs" role="tablist">${['pre','post'].map(x=>`<button class="tab" role="tab" data-ttab="${x}" aria-selected="${S.tTab===x}">${DATA[x].name}：${esc(DATA[x].title)}</button>`).join('')}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <h3>能力指標答對率 <span class="muted small">（${rs.length} 人）</span></h3>
    <div class="skills">${skills.map(s=>`<div class="sk"><span>${esc(s.label)}<br><span class="muted small">${s.ids}</span></span>
      <div class="bar"><i class="${s.rate==null?'':barCls(s.rate)}" style="width:${s.rate??0}%"></i></div><b style="text-align:right">${s.rate==null?'—':s.rate+'%'}</b></div>`).join('')}</div>
  </div>
  <div class="items">${itemStats.map(s=>`
    <div class="item ${S.openItem===s.q.id?'open':''}"><span class="id">${s.q.id}</span>
      <div class="txt"><button class="itembtn" data-item="${s.q.id}" aria-expanded="${S.openItem===s.q.id}">${esc(shortStem(s.q))}<span class="more">${S.openItem===s.q.id?'收合':'看原題'}</span></button><div class="muted small" style="font-family:var(--f-ui)">正確答案：${esc(rightAns(s.q))}・${esc(t.skills[s.q.skill])}</div>
        ${s.wrongs.length?`<div class="errs">${s.wrongs.map(([k,w])=>`<span class="err">答「${esc(k)}」${w.n} 人${w.diag?`：${esc(w.diag)}`:''}</span>`).join('')}</div>`:''}</div>
      <div class="rate"><div class="bar"><i class="${s.rate==null?'':barCls(s.rate)}" style="width:${s.rate??0}%"></i></div>
        <span class="small">${s.rate==null?'尚無資料':`答對率 <b>${s.rate}%</b>（${s.n} 人）`}</span></div>
      ${S.openItem===s.q.id ? `<div class="qprev"><div class="stem">${s.q.stemH}</div>${qBody(s.q, {counts:s.counts})}<div class="row"><span class="spacer"></span><button class="btn say" data-sayitem="${s.q.id}">${SPK}唸題目</button></div></div>` : ''}
    </div>`).join('')}</div>`;

  // records management
  const allR = recs.filter(r => S.tCls==='全部' || r.cls===S.tCls).sort((a,b)=>b.ts-a.ts);
  const manage = `
  <details class="card"><summary>所有作答紀錄（${allR.length} 筆，含重做）</summary>
    <p class="muted small">同一位學生重做時，統計只採用最新一次。刪除測試用或填錯的紀錄後無法復原。</p>
    <div class="tablewrap"><table><thead><tr><th>時間</th><th>測驗</th><th>班級</th><th class="num">座號</th><th>姓名</th><th class="num">分數</th><th></th></tr></thead><tbody>
    ${allR.map(r=>`<tr><td>${fmtTime(r.ts)}${r._local?' <span class="pill warn">未上傳</span>':''}</td><td>${DATA[r.test]?.name||r.test}</td><td>${esc(r.cls)}</td><td class="num">${r.seat}</td><td>${esc(rosterName(r.cls, r.seat) || r.name)}</td><td class="num">${r.score}</td>
      <td>${S.delId===r.id ? `<span class="confirm"><span class="small">確定刪除？</span><button class="btn danger" data-delyes="${esc(r.id)}">刪除</button><button class="btn" data-delno="1">取消</button></span>` : `<button class="btn" data-del="${esc(r.id)}">刪除</button>`}</td></tr>`).join('')}
    </tbody></table></div>
  </details>`;

  return `
  <div class="topbar"><span class="brand"><span class="mark">教師專區</span></span><h1 style="font-size:1.6rem">除法小測站・學習報告</h1><span class="spacer"></span>
    <button class="btn" id="toStart">回作答畫面</button></div>
  <div class="row">
    <label class="row small">班級
      <select class="inp" id="tCls" style="width:auto;min-height:40px;padding:6px 10px">${classes.map(c=>`<option ${c===S.tCls?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
    <span class="spacer"></span>
    <button class="btn" data-preview="pre">預覽前測</button><button class="btn" data-preview="post">預覽後測</button>
    <button class="btn primary" id="csv">匯出成績 CSV</button>
  </div>
  ${S.loadErr?`<div class="notice bad">${esc(S.loadErr)}</div>`:''}${LS.get('pending',[]).length?`<div class="notice warn">這台裝置有 ${LS.get('pending',[]).length} 份作答還沒送出，已一併列在下方（標示「未上傳」）。</div>`:''}
  ${tiles}
  <h2>學生名單</h2>
  ${table}
  ${missingBlock(st)}
  ${detail}
  ${analysis}
  ${manage}
  <div class="row muted small">已登入：${esc(S.teacherEmail)}　<button class="btn" id="logout">登出</button></div>`;
}

const gv = i => i.given.every(g => g === '' || g == null) ? '空白' : i.given.map(g => g === '' ? '_' : g).join('、');
function missingBlock(st){
  if (!S.fullRoster.length || !st.length) return '';
  const pre = st.filter(s=>!s.pre), post = st.filter(s=>!s.post);
  const line = (lbl, arr) => `<div><b>${lbl}未完成（${arr.length} 人）</b>：${arr.length ? arr.map(s=>`${s.seat} ${esc(s.name)}`).join('、') : '全部完成'}</div>`;
  return `<div class="card small" style="display:flex;flex-direction:column;gap:6px">${line('前測', pre)}${line('後測', post)}</div>`;
}
function shortStem(q){
  if (q.type === 'eq') return q.expr.map(x => typeof x==='number' ? '□' : x === '\n' ? '，' : x).join('') + (q.stem.startsWith('想') || q.stem.startsWith('算') ? '' : '（' + q.stem + '）');
  if (q.type === 'long') return q.stem;
  return q.stem;
}
function rightAns(q){
  if (q.type === 'mc') return 'ABCD'[q.ans] + '. ' + q.opts[q.ans];
  return q.blanks.map(b => b.ans).join('、');
}
function fmtTime(ts){ const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

function buildCSV(){
  const recs = allRecords().filter(r => S.tCls==='全部' || r.cls===S.tCls).sort((a,b)=>a.test.localeCompare(b.test)||a.cls.localeCompare(b.cls,'zh-Hant')||a.seat-b.seat||a.ts-b.ts);
  const q = s => '"' + String(s ?? '').replace(/"/g,'""') + '"';
  const head = ['測驗','班級','座號','姓名','分數','答對題數','總題數','作答分鐘','交卷時間', ...Array.from({length:10},(_,i)=>`第${i+1}題`), ...Array.from({length:10},(_,i)=>`第${i+1}題作答`)];
  const lines = [head.map(q).join(',')];
  for (const r of recs){
    lines.push([DATA[r.test]?.name, r.cls, r.seat, rosterName(r.cls, r.seat) || r.name, r.score, r.correct, r.total, Math.round((r.sec||0)/6)/10, new Date(r.ts).toLocaleString('zh-TW'),
      ...r.items.map(i=>i.ok?1:0), ...r.items.map(i=>i.given.join('/'))].map(q).join(','));
  }
  return '﻿' + lines.join('\r\n');
}

/* ---------------- events ---------------- */
function bind(){
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));
  on('#zyToggle','change', e => { S.zhuyin = e.target.checked; LS.set('zhuyin', S.zhuyin); render(); });

  if (S.view === 'start'){
    on('[data-test]','click', e => { S.test = e.currentTarget.dataset.test; render(); });
    const upd = () => { const ok = S.test && S.cls.trim() && S.seat && S.name.trim(); $('#go').disabled = !ok; $('#go').nextElementSibling.textContent = ok ? '' : '還沒選測驗或還沒選名字'; };
    on('#cls','input', e => { S.cls = e.target.value; upd(); });
    on('#seat','input', e => { e.target.value = norm(e.target.value).replace(/\D/g,''); S.seat = e.target.value; upd(); });
    on('#name','input', e => { S.name = e.target.value; upd(); });
    on('[data-cls]','click', e => { S.cls = e.currentTarget.dataset.cls; S.seat=''; S.name=''; render(); });
    on('[data-seat]','click', e => { S.seat = e.currentTarget.dataset.seat; S.name = e.currentTarget.dataset.masked; render(); });
    on('#manual','click', () => { S.manual = true; S.seat=''; S.name=''; render(); });
    on('#useList','click', () => { S.manual = false; S.seat=''; S.name=''; render(); });
    on('#go','click', () => { LS.set('cls', S.cls.trim()); S.cls = S.cls.trim(); S.name = S.name.trim(); S.answers = {}; S.idx = 0; S.t0 = Date.now(); S.preview = false; S.view = 'quiz'; render(); });
    on('#toTeacher','click', openTeacher);
  }
  if (S.view === 'quiz' || S.view === 'review'){
    on('.nin','input', e => { const el = e.target; el.value = norm(el.value).replace(/\D/g,'').slice(0,3);
      const a = S.answers[el.dataset.q] || (S.answers[el.dataset.q] = []); a[+el.dataset.k] = el.value;
      const t = curTest(); const i = t.items.findIndex(x=>x.id===el.dataset.q); const dot = document.querySelectorAll('.dot')[i]; if (dot) dot.classList.toggle('done', isAnswered(t.items[i])); });
    on('.nin','keydown', e => { if (e.key === 'Enter'){ const all = [...document.querySelectorAll('.nin')]; const i = all.indexOf(e.target); if (all[i+1]) all[i+1].focus(); else ($('#next')||$('#toReview'))?.click(); } });
    on('[data-opt]','click', e => { const q = curTest().items[S.idx]; S.answers[q.id] = +e.currentTarget.dataset.opt; render(); });
    on('[data-go]','click', e => { S.idx = +e.currentTarget.dataset.go; S.view = 'quiz'; render(); focusFirst(); });
    on('#prev','click', () => { S.idx--; render(); focusFirst(); });
    on('#next','click', () => { S.idx++; render(); focusFirst(); });
    on('#toReview','click', () => { S.view = 'review'; render(); });
    on('#say','click', () => speak(curTest().items[S.idx].say));
    on('#submit','click', submit);
  }
  if (S.view === 'done'){
    on('#nextKid','click', () => { S.seat=''; S.name=''; S.manual=false; S.answers={}; S.result=null; S.view='start'; S.preview=false; render(); });
    on('#backTeacher','click', () => { S.preview=false; S.view='teacher'; render(); });
  }
  if (S.view === 'pin'){
    on('#loginForm','submit', async e => {
      e.preventDefault();
      if (!CFG_OK){ S.loginErr = '網頁還沒填入 Supabase 網址與金鑰。'; render(); return; }
      S.teacherEmail = $('#lEmail').value.trim(); const pw = $('#lPass').value;
      S.loginBusy = true; S.loginErr = ''; render();
      try {
        const c = await getClient();
        const {error} = await c.auth.signInWithPassword({email:S.teacherEmail, password:pw});
        S.loginBusy = false;
        if (error){ S.loginErr = 'Email 或密碼不對，請再試一次。'; render(); return; }
        S.authed = true; S.view = 'teacher'; render(); startTeacher();
      } catch(err){ S.loginBusy = false; S.loginErr = '連不上 Supabase，請確認網路。'; render(); }
    });
    on('#toStart','click', () => { S.view='start'; render(); });
    $('#lEmail')?.focus();
  }
  if (S.view === 'teacher'){
    on('#toStart','click', () => { S.view='start'; render(); });
    on('#tCls','change', e => { S.tCls = e.target.value; S.selKey=null; render(); });
    on('[data-ttab]','click', e => { S.tTab = e.currentTarget.dataset.ttab; S.openItem = null; render(); });
    on('[data-item]','click', e => { const id = e.currentTarget.dataset.item; S.openItem = S.openItem === id ? null : id; render(); });
    on('[data-sayitem]','click', e => { const id = e.currentTarget.dataset.sayitem; const q = DATA[S.tTab].items.find(x=>x.id===id); if (q) speak(q.say); });
    on('[data-stu]','click', e => { S.selKey = e.currentTarget.dataset.stu; render(); document.querySelector('.detail')?.scrollIntoView({behavior:'smooth', block:'nearest'}); });
    on('#closeStu','click', () => { S.selKey=null; render(); });
    on('[data-preview]','click', e => { S.test = e.currentTarget.dataset.preview; S.preview = true; S.cls='教師'; S.seat='0'; S.name='預覽'; S.answers={}; S.idx=0; S.t0=Date.now(); S.view='quiz'; render(); });
    on('[data-del]','click', e => { S.delId = e.currentTarget.dataset.del; render(); });
    on('[data-delno]','click', () => { S.delId = null; render(); });
    on('[data-delyes]','click', async e => {
      const id = e.currentTarget.dataset.delyes;
      const pend = LS.get('pending', []);
      if (pend.some(r=>r.client_id===id)) LS.set('pending', pend.filter(r=>r.client_id!==id));
      else {
        const {error} = await sb.from('results').delete().eq('id', id);
        if (error) S.loadErr = '刪除失敗：' + error.message; else S.records = S.records.filter(r => r.id !== id);
      }
      S.delId = null; render();
    });
    on('#csv','click', () => {
      const blob = new Blob([buildCSV()], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `除法小測站成績_${S.tCls}_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
    on('#logout','click', async () => { try { await sb.auth.signOut(); } catch(e){} if (channel){ sb.removeChannel(channel); channel = null; }
      S.authed = false; S.records = []; S.fullRoster = []; S.dbLoaded = false; teacherStarted = false; S.view = 'start'; render(); });
  }
}
function focusFirst(){ const el = document.querySelector('.nin'); if (el && !el.value) el.focus({preventScroll:true}); }

async function submit(){
  const t = curTest();
  const g = grade(t, S.answers);
  S.result = g; S.view = 'done';
  if (S.preview){ render(); return; }
  S.saveState = 'saving'; render();
  const rec = {test:t.id, cls:S.cls, seat:Number(S.seat), name:S.name, score:g.score, correct:g.correct, total:g.total,
    items:g.items, ts:Date.now(), sec:Math.round((Date.now()-S.t0)/1000)};
  S.saveState = await saveRecord(rec);
  if (S.view === 'done') render();
}

let teacherStarted = false;
async function openTeacher(){
  if (S.authed){ S.view = 'teacher'; render(); return; }
  if (CFG_OK){
    try { const c = await getClient(); const {data} = await c.auth.getSession();
      if (data && data.session){ S.authed = true; S.teacherEmail = data.session.user.email || ''; S.view = 'teacher'; render(); startTeacher(); return; } } catch(e){}
  }
  S.loginErr = ''; S.view = 'pin'; render();
}
async function loadAll(){
  const out = []; const page = 1000;
  for (let from = 0; ; from += page){
    const {data, error} = await sb.from('results').select('*').order('ts', {ascending:true}).range(from, from + page - 1);
    if (error) throw error;
    out.push(...data); if (data.length < page) break;
  }
  return out;
}
async function startTeacher(){
  if (teacherStarted) return; teacherStarted = true;
  flushPending();
  const timer = setTimeout(() => { if (!S.dbLoaded){ S.dbSlow = true; if (S.view==='teacher') render(); } }, 10000);
  try {
    S.records = await loadAll(); S.loadErr = '';
    try { const {data} = await sb.from('roster').select('cls,seat,name').order('seat'); if (data) S.fullRoster = data; } catch(e){}
    if (!S.records.length){
      // 檢查是否在教師名單內
      const {data} = await sb.rpc('is_teacher');
      if (data === false) S.loadErr = '這個帳號不在教師名單裡，看不到成績。請在 Supabase 的 teachers 資料表加入這個 Email。';
    }
  } catch(e){ S.loadErr = '讀取成績失敗：' + (e.message || '請確認網路'); }
  S.dbLoaded = true; clearTimeout(timer);
  if (S.view === 'teacher') render();
  channel = sb.channel('results-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'results'}, payload => {
      if (payload.eventType === 'INSERT') S.records = [...S.records.filter(r => r.id !== payload.new.id), payload.new];
      else if (payload.eventType === 'DELETE') S.records = S.records.filter(r => r.id !== payload.old.id);
      if (S.view === 'teacher') render();
    }).subscribe();
}

render();
</script>
